version: 2

seeds:
  - name: zone_lookup
    description: >
      The TLC taxi zone reference, one row per zone id 1 to 265. Named
      zone_lookup rather than dim_zone because dbt resolves seeds and models in
      one namespace and the dimension of that name is built in the marts layer.
      Generated by the ingest from the published shapefile, which dissolves the
      polygons of a multi part zone into one.
    columns:
      - name: zone_id
        description: TLC LocationID, one row each.
        data_tests:
          - unique
          - not_null
      - name: borough
        data_tests:
          - not_null
      - name: service_zone
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Yellow Zone", "Boro Zone", "Airports", "EWR", "N/A"]
      - name: has_geometry
        description: >
          Whether the zone has a polygon at all. False for the two unknown codes
          and for the three zones the shapefile does not carry.
        data_tests:
          - not_null
      - name: part_count
        description: >
          How many polygon records the zone was assembled from before the
          dissolve: one for most zones, two for zone 56, three for zone 103 and
          zero where there is no geometry at all.
        data_tests:
          - not_null

  - name: holiday
    description: >
      Holiday dates with the name each one is published under. Generated from
      the statutory rules once and committed, so the list is reviewable in a
      diff rather than recomputed on every run. A fixed date holiday that falls
      at a weekend contributes a second row for the observed date, because the
      day offices and schools close is the day street demand moves.
    columns:
      - name: holiday_date
        data_tests:
          - unique
          - not_null
      - name: holiday_name
        data_tests:
          - not_null
      - name: holiday_scope
        description: Which authority observes the day, which is what justifies its presence.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["federal", "new_york_state"]
