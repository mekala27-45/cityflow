version: 2

seeds:
  - name: zone_lookup
    description: >
      The TLC taxi zone reference, one row per shapefile polygon. Named
      zone_lookup rather than dim_zone because dbt resolves seeds and models in
      one namespace and the dimension of that name is built in the marts layer.
      The grain is polygons, not zones: see stg_zones, which collapses it.
    columns:
      - name: zone_id
        description: TLC LocationID. Repeats for a zone published as several polygons.
        data_tests:
          - not_null
      - name: borough
        data_tests:
          - not_null
      - name: service_zone
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Yellow Zone", "Boro Zone", "Airports", "EWR", "N/A"]

  - name: holiday
    description: >
      Holiday dates with the name each one is published under. Generated from
      the statutory rules once and committed, so the list is reviewable in a
      diff rather than recomputed on every run. A fixed date holiday that falls
      at a weekend contributes a second row for the observed date, because the
      day offices and schools close is the day street demand moves.
    columns:
      - name: holiday_date
        data_tests:
          - unique
          - not_null
      - name: holiday_name
        data_tests:
          - not_null
      - name: holiday_scope
        description: Which authority observes the day, which is what justifies its presence.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["federal", "new_york_state"]
