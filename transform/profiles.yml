# dbt does not change the working directory for --project-dir, so this path is
# resolved against wherever dbt is invoked, which for this repository is always
# the root (see the transform targets in the Makefile and CI). A path relative
# to transform/ would look tidier and would resolve one directory too high.
#
# The settings block matters at scale. DuckDB's default memory limit is a share
# of physical memory, and a limit at or above what the machine actually has is
# not a bigger budget, it is an out of memory kill partway through a fact table
# build. Set below RAM, DuckDB spills to temp_directory and finishes. These
# mirror config/cityflow.yml, which the Python side reads.
cityflow:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: warehouse/cityflow.duckdb
      schema: main
      threads: 2
      settings:
        memory_limit: 3GB
        temp_directory: warehouse/tmp
        preserve_insertion_order: false
