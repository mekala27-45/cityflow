[project]
name = "cityflow-stats"
version = "0.1.0"
description = "Wilson intervals, STL decomposition, PELT changepoints and Benjamini-Hochberg correction."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cityflow_stats"]
