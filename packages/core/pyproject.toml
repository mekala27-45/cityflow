[project]
name = "cityflow-core"
version = "0.1.1"
description = "Configuration, schemas and the DuckDB session factory shared across cityflow."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pydantic>=2.10",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cityflow_core"]
