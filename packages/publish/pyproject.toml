[project]
name = "cityflow-publish"
version = "0.1.0"
description = "Aggregate builders, the parquet writer and the shipped size budget."
requires-python = ">=3.12"
dependencies = [
    "cityflow-core",
    "cityflow-stats",
    "duckdb>=1.1",
    "pyarrow>=18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cityflow_publish"]
