name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.7"
  NODE_VERSION: "22"

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-extras
      - name: ruff
        run: |
          uv run ruff check packages src scripts tests metrics
          uv run ruff format --check packages src scripts tests
      - name: mypy strict
        run: uv run mypy packages src
      - name: sqlfluff
        run: uv run sqlfluff lint transform/models transform/tests
      - name: no em dashes
        run: uv run python scripts/check_no_em_dash.py

  test:
    name: python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-extras
      - name: pytest with the coverage floor
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  gates:
    name: published figures, size and the metric layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: uv sync --all-extras
      # These run against the committed shipped layer and the committed
      # documents, which is the point: they check what a reader will see.
      - name: every published figure re-derived
        run: uv run python scripts/check_published_numbers.py
      - name: shipped size budget
        run: uv run python scripts/check_shipped_size.py
      - name: no metric computed outside the layer
        run: uv run python scripts/check_metric_layer.py
      - name: palette revalidated in both modes
        run: make palette

  pipeline:
    name: end to end on generated data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-extras
      # The whole pipeline, at a scale that finishes in a CI minute, in a copy
      # of the tree so it cannot overwrite the committed shipped layer and make
      # the published figures gate pass against numbers it just wrote.
      - name: assert dbt is actually present
        run: |
          uv run dbt --version
          test -n "$(command -v node)"
      - name: run the pipeline into a scratch tree
        run: |
          set -euo pipefail
          rsync -a --exclude warehouse --exclude web/out --exclude node_modules \
            ./ /tmp/e2e/
          cd /tmp/e2e
          export CITYFLOW_BACKEND=synthetic
          uv run cityflow zones
          uv run cityflow ingest --scale 0.002 --fresh
          uv run dbt seed --project-dir transform --profiles-dir transform
          uv run dbt build --project-dir transform --profiles-dir transform
          uv run cityflow publish
          uv run cityflow manifest
          uv run cityflow reconcile
          uv run python scripts/bench_queries.py --repeats 5
      - name: the scratch tree must not have leaked into the repository
        run: git diff --exit-code

  web:
    name: dashboard build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: no third party origin reached the export
        working-directory: web
        run: |
          set -euo pipefail
          if grep -rEo "https://(cdn|unpkg|fonts\.googleapis|cdnjs)[^\"' )]*" out \
               --include=*.js --include=*.html --include=*.css; then
            echo "The export reaches a third party origin. It must be self contained."
            exit 1
          fi
      - name: install the browser the smoke test needs
        working-directory: web
        run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-screenshots
          path: web/tests/screenshots/
